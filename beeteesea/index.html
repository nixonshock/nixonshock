<!doctype html>
<html lang="en" data-theme="sea">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bee Tee Sea — Live Bitcoin Mempool</title>
<meta name="description" content="Bee · Tee · Sea — the Bitcoin mempool, three ways. Watch every transaction waiting for a block: bees in a meadow, T-shirts on a factory line, or ships and sea creatures on the open water.">
<link rel="canonical" href="https://nixonshock.com/beeteesea">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bee Tee Sea">
<meta property="og:title" content="Bee Tee Sea — Live Bitcoin Mempool">
<meta property="og:description" content="The Bitcoin mempool, three ways. Pick a theme and watch every transaction waiting for a block — live.">
<meta property="og:url" content="https://nixonshock.com/beeteesea">
<meta property="og:image" content="https://nixonshock.com/beeteesea/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Bee Tee Sea — Live Bitcoin Mempool">
<meta name="twitter:description" content="The Bitcoin mempool, three ways — bees, T-shirts, or the open sea. Live.">
<meta name="twitter:image" content="https://nixonshock.com/beeteesea/og.png">
<meta name="theme-color" content="#eceae4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f7931a'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' font-weight='700' text-anchor='middle' fill='%230b0e13'%3EB%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;background:#eceae4;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink,#1b1e24);--ink:#1b1e24;--acc:#d96a00;
    -webkit-font-smoothing:antialiased;
  }
  .stage{position:fixed;inset:0}
  #fr{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;
      opacity:0;transition:opacity .45s ease}
  #fr.on{opacity:1}

  /* The title takes over the scene's own title slot: same type, same ink, theme-adaptive */
  .ttl{position:fixed;left:22px;top:18px;z-index:5;max-width:min(560px,76vw);pointer-events:none}
  .ttl h1{
    margin:0;display:flex;align-items:baseline;gap:.3em;
    font-size:clamp(26px,3.6vw,36px);line-height:1;font-weight:780;letter-spacing:-.02em;
    color:var(--ink);text-wrap:balance;
  }
  .w{
    font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
    opacity:.42;transition:opacity .18s,color .18s;-webkit-tap-highlight-color:transparent;
    pointer-events:auto;
  }
  .w:hover{opacity:.78}
  .w[aria-current="true"]{opacity:1;color:var(--acc)}
  .w:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:3px}
  .ttl p{margin:8px 0 0;max-width:38ch;font-size:13.5px;line-height:1.35;color:var(--ink);opacity:.82}
  .full{
    pointer-events:auto;display:inline-block;margin-top:9px;padding-bottom:1px;
    font-size:11.5px;letter-spacing:.02em;color:var(--ink);opacity:.5;
    text-decoration:none;border-bottom:1px solid currentColor;
  }
  .full:hover{opacity:.85}

  .boot{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:9px;
    font:600 12px/1 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);opacity:.5;
    transition:opacity .35s;z-index:4;
  }
  .boot.gone{opacity:0;pointer-events:none}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:p 1.1s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
  @media (max-width:560px){
    .ttl{left:14px;top:12px;max-width:84vw}
    .ttl h1{gap:.22em}
    .ttl p{font-size:12.5px}
  }
</style>
</head>
<body>
<div class="stage"><iframe id="fr" title="Live Bitcoin mempool animation" allow="autoplay"></iframe></div>

<div class="ttl">
  <h1>
    <button class="w" data-t="bee" type="button">Bee</button>
    <button class="w" data-t="tee" type="button">Tee</button>
    <button class="w" data-t="sea" type="button">Sea</button>
  </h1>
  <p id="tag">Bitcoin Mempool Ocean — every transaction waiting for a block, drawn by how much bitcoin it moves.</p>
  <a class="full" id="full" href="/btsea/" target="_blank" rel="noopener">open full screen ↗</a>
</div>

<div class="boot" id="boot"><span class="dot"></span> loading the mempool…</div>

<script>
const THEMES = {
  bee: { dir: 'beetc', name: 'Bee',
         tag: 'Bitcoin Mempool Meadow — every transaction waiting for a block, flying by how much bitcoin it moves.' },
  tee: { dir: 'bteec', name: 'Tee',
         tag: 'Bitcoin Mempool Factory — every transaction waiting for a block, printed and shipped by how much bitcoin it moves.' },
  sea: { dir: 'btsea', name: 'Sea',
         tag: 'Bitcoin Mempool Ocean — every transaction waiting for a block, drawn by how much bitcoin it moves.' }
};
const ORDER = ['bee', 'tee', 'sea'];
const fr = document.getElementById('fr');
const boot = document.getElementById('boot');
const tag = document.getElementById('tag');
const full = document.getElementById('full');
const words = Array.prototype.slice.call(document.querySelectorAll('.w'));
let current = null;

function pick() {
  const h = (location.hash || '').replace('#', '').toLowerCase();
  const q = new URLSearchParams(location.search).get('theme');
  const want = (q || h || '').toLowerCase();
  return THEMES[want] ? want : 'sea';
}

function select(key, push) {
  if (!THEMES[key]) key = 'sea';
  if (key === current) return;
  current = key;
  const t = THEMES[key];
  document.documentElement.setAttribute('data-theme', key);
  words.forEach(function (w) { w.setAttribute('aria-current', w.dataset.t === key ? 'true' : 'false'); });
  tag.textContent = t.tag;
  full.setAttribute('href', '/' + t.dir + '/');
  document.title = t.name + ' · Bee Tee Sea — Live Bitcoin Mempool';
  boot.classList.remove('gone');
  fr.classList.remove('on');
  fr.src = '/' + t.dir + '/';          // one scene alive at a time
  if (push && history.replaceState) history.replaceState(null, '', '#' + key);
}

// Adopt the scene's own ink / accent / background so the title looks native — day *and* night.
fr.addEventListener('load', function () {
  try {
    const d = fr.contentDocument, cs = getComputedStyle(d.documentElement);
    const ink = (cs.getPropertyValue('--sky-ink') || '').trim();
    const acc = (cs.getPropertyValue('--accent') || '').trim();
    const bg = (cs.getPropertyValue('--bg') || '').trim();
    if (ink) document.body.style.setProperty('--ink', ink);
    if (acc) document.body.style.setProperty('--acc', acc);
    if (bg) document.body.style.background = bg;
    const p = d.querySelector('.brand p');
    if (p && p.textContent.trim()) tag.textContent = p.textContent.trim();
  } catch (e) { /* cross-origin or blocked: fall back to the defaults */ }
  boot.classList.add('gone');
  requestAnimationFrame(function () { fr.classList.add('on'); });
});

words.forEach(function (w) { w.addEventListener('click', function () { select(w.dataset.t, true); }); });

document.addEventListener('keydown', function (e) {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const i = ORDER.indexOf(current);
  if (e.key === 'ArrowRight') select(ORDER[(i + 1) % ORDER.length], true);
  else if (e.key === 'ArrowLeft') select(ORDER[(i + ORDER.length - 1) % ORDER.length], true);
  else if (e.key >= '1' && e.key <= '3') select(ORDER[+e.key - 1], true);
});

window.addEventListener('hashchange', function () { select(pick(), false); });

select(pick(), false);
</script>
</body>
</html>
